global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - 'alert.rules.yml'

scrape_configs:
  - job_name: 'vidpulse-backend'
    metrics_path: '/api/v1/health/metrics'
    static_configs:
      - targets: ['backend:8000']

  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx:80']
