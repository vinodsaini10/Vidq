version: '3.8'

services:
  nginx:
    image: nginx:alpine-slim
    container_name: vidpulse-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - frontend
      - backend
    networks:
      - vidpulse-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: vidpulse-frontend
    restart: always
    environment:
      - NODE_ENV=production
    networks:
      - vidpulse-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vidpulse-backend
    restart: always
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vidpulse-network

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: vidpulse-celery-worker
    restart: always
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=4
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - backend
    networks:
      - vidpulse-network

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: vidpulse-celery-beat
    restart: always
    command: celery -A app.core.celery_app beat --loglevel=info
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - backend
    networks:
      - vidpulse-network

  postgres:
    image: postgres:15-alpine
    container_name: vidpulse-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vidpulse_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_db_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-vidpulse_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vidpulse_user} -d ${POSTGRES_DB:-vidpulse_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vidpulse-network

  redis:
    image: redis:7-alpine
    container_name: vidpulse-redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vidpulse-network

  prometheus:
    image: prom/prometheus:latest
    container_name: vidpulse-prometheus
    restart: always
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - vidpulse-network

volumes:
  postgres_data:
  redis_data:
  prometheus_data:

networks:
  vidpulse-network:
    driver: bridge
